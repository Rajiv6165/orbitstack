apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: orbitstack-secrets
  namespace: orbitstack
  labels:
    app.kubernetes.io/name: orbitstack-secrets
    app.kubernetes.io/part-of: orbitstack-platform
spec:
  # Decrypted payload values when sealed:
  # POSTGRES_PASSWORD: <production-password>
  # SECRET_KEY: <production-jwt-secret>
  # DATABASE_URL_AUTH: postgresql://postgres:<POSTGRES_PASSWORD>@pgbouncer.orbitstack.svc.cluster.local:6432/auth_db
  # DATABASE_URL_CATALOG: postgresql://postgres:<POSTGRES_PASSWORD>@pgbouncer.orbitstack.svc.cluster.local:6432/catalog_db
  # DATABASE_URL_ORDER: postgresql://postgres:<POSTGRES_PASSWORD>@pgbouncer.orbitstack.svc.cluster.local:6432/order_db
  encryptedData:
    POSTGRES_PASSWORD: AgB+dummy+encrypted+data+for+POSTGRES_PASSWORD=
    SECRET_KEY: AgB+dummy+encrypted+data+for+SECRET_KEY=
    DATABASE_URL_AUTH: AgB+dummy+encrypted+data+for+DATABASE_URL_AUTH=
    DATABASE_URL_CATALOG: AgB+dummy+encrypted+data+for+DATABASE_URL_CATALOG=
    DATABASE_URL_ORDER: AgB+dummy+encrypted+data+for+DATABASE_URL_ORDER=
  template:
    metadata:
      name: orbitstack-secrets
      namespace: orbitstack
    type: Opaque
